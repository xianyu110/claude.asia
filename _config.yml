# GitHub Pages 配置文件
title: 支持 Claude 最新模型，国内直接使用
description: 支持 Claude 最新模型，覆盖 Agent、编程、推理和工具调用，国内可直接使用 Claude
url: "https://momoai.dadoudou117.com"
baseurl: ""

# SEO 优化
lang: zh-CN
author: Claude中国团队
keywords: Claude最新模型, Claude国内使用, AI, 人工智能, 聊天机器人, 中国, 镜像

# 插件配置
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# 构建设置
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 排除文件
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/

# 包含文件
include:
  - _pages

# 默认设置
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
