name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Prepare public site
        run: |
          mkdir -p _public/assets _public/js _public/languages _public/en _public/ja _public/ko _public/es
          cp index.html 404.html styles.css script.js contact-widget.css contact-widget.js robots.txt sitemap.xml CNAME .nojekyll favicon.ico apple-touch-icon.png apple-touch-icon-precomposed.png _public/
          cp -r assets/. _public/assets/
          cp -r js/. _public/js/
          cp -r languages/. _public/languages/
          cp -r en/. _public/en/
          cp -r ja/. _public/ja/
          cp -r ko/. _public/ko/
          cp -r es/. _public/es/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_public'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4